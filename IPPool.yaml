apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: metallb-single-ip
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.240-192.168.1.250
  autoAssign: false
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: metallb-single-ip-adv
  namespace: metallb-system
spec:
  ipAddressPools:
  - metallb-single-ip